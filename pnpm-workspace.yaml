catalogMode: prefer
catalogPrune: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@types/node': ^26.6.6
  eslint: ^10.14.0
  random: ^5.5.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.1.0
